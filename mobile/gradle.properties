org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The app version (SemVer). versionCode = major × 1,000,000 + minor × 1,000 + patch, as version.rc gives it.
# A release build may pass its version (-PappVersion=1.2.3); local builds use this one as is.
appVersion=0.1.0
# Where the updater reads the version manifest (JSON); APKs sit next to it.
updateUrl=https://app.brainfactory.id/semver/brain-db/version.rc
# Sign-in: buyers get a one-time code by email and a licence token that opening the app and downloading updates need.
licenceApi=https://app.brainfactory.id/api/auth/otp
